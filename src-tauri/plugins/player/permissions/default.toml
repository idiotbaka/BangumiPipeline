"$schema" = "schemas/schema.json"

[default]
description = "Allows native fullscreen, playback wake lock, app theme system bars, and copying invitation codes."
permissions = [
  "allow-enterFullscreen",
  "allow-exitFullscreen",
  "allow-setKeepScreenOn",
  "allow-setTheme",
  "allow-copyText",
  "allow-enter-fullscreen",
  "allow-exit-fullscreen",
  "allow-set-keep-screen-on",
]
